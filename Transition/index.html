    <title>Document</title>
    <style>
        .shape{
        width: 200px;
        height: 200px;
        background-color: blue;
        border-radius: 18px;
        transition: all 1s ease-in-out 2s;
        
    }
    .shape:hover{
        transform: translate(100px, 200px);
    }
     .circle{
        width: 200px;
        height: 200px;
        background-color: rosybrown;
        border-radius: 18px 12px 30px;
        transition: all 1s ease-in-out 2s;
     }
     .circle:hover{
        transform: rotate(200deg);
     }
     .img{
        width: 150px;
        transition: all 1s ;
     }
     .img:hover{
        transform: scale(1.5);
     }
     .rect{
        width: 300px;
        height: 200px;
        background-color: aquamarine;
        transition: all 1s;
     }
     .rect:hover{
        transform: skew(300deg);
     }
     .box {
  width: 100px;
  height: 100px;
  background: coral;
  position: relative;
  animation: moveBox 3s infinite alternate;
  
}

@keyframes moveBox {
  from { left: 0; }
  to { left: 300px; }
}


    </style>
