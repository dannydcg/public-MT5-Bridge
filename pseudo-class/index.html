<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .square {
            background-color: blue;
            width: 120px;
            height: 120px;
            transition-property: all;
            transition-delay: 2s;
            transition-duration: 2s;

        }

        .square:hover {
            background-color: lightblue;
            border: 4px solid rebeccapurple;

        }

        .holder div:nth-child(1) {

            background-color: aqua;
            width: 100px;
            height: 100px;
            margin: 50px;
            border-radius: 20px;

        }

        .holder div:nth-child(2) {

            background-color: rgb(0, 255, 119);
            width: 100px;
            height: 100px;
        }

        .holder div:nth-child(3) {

            background-color: rgb(36, 146, 115);
            width: 100px;
            height: 100px;
        }

        .holder div:nth-child(4) {

            background-color: rgb(16, 27, 146);
            width: 100px;
            height: 100px;
        }
        .holder p{
            background-color: blue;
            color: antiquewhite;
        }

        .holder div:nth-child(5) {

            background-color: rgb(255, 0, 47);
            width: 100px;
            height: 100px;
        }

        section div:first-child {
            background-color: rgb(115, 0, 255);
            width: 100px;
            height: 100px;
            
        }

        .btn:active {
            background-color: blue;
        }

        .hide,
        .hides,
        .hide3 {
            display: none;
        }

        #btn:focus .hide{
            display: block;
        }

        .first:focus-within .hides {
            display: block;
        }

        .hide2:focus-within .hide3 {
            display: block;
        }
    </style>
</head>

<body>
    <div class="square"></div>
    <div class="holder">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <p>love</p>
    </div>


        <section>
            <div></div>
            <div></div>
        </section>
        <button class="btn">click me</button>
        <button id="btn">
            <p>Show More</p>
            <div class="hide">
                <p>Practice</p>
                <p>Create time to Practice</p>
                <p>DOnt be lazy to Practice</p>


            
        </button>
        <div class="first">
            <button>Show more</button>
            <div class="hides">
                <p>Practice</p>
                <p>Create time to practice</p>
                <p>Dont be lazy to practice</p>
            </div>

        </div>

        <div class="hide2">
            <input type="text" placeholder="email">
            <div class="hide3">


                <p>practice</p>
                <p>create time to practice</p>
                <p>dont be lazy to practice</p>
            </div>
        </div>
</body>

</html>
