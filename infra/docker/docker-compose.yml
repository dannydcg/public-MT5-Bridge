version: '3.9'
services:
  backend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    working_dir: /workspace/apps/backend
    command: npm run dev
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crypto_mt5_bridge
      JWT_SECRET: change-this-secret
    volumes:
      - ../../:/workspace
    depends_on:
      - postgres
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: crypto_mt5_bridge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
