<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="status-bar">
        <span class="time">10:14</span>
        <div class="icons">
          <span>📶</span>
          <span>🌐</span>
          <span>🔋54%</span>
        </div>
      </div>
      <h1>WhatsApp</h1>
      <div class="header-icons">
        <span>📷</span>
        <span>⋮</span>
      </div>
    </header>

    <div class="search-bar">
      <input type="text" placeholder="Ask Meta AI or Search" />
    </div>

    <div class="tabs">
      <button class="active">All</button>
      <button>Unread 7</button>
      <button>Favorites</button>
      <button>Groups 4</button>
    </div>

    <main class="chat-list">
      <div class="chat">
        <img src="setup.jpg" alt="SET UP" class="avatar" />
        <div class="chat-info">
          <h2>TEACHER</h2>
          <p>Teach us website</p>
        </div>
        <div class="meta">
          <span class="time">9:59 AM</span>
          <span class="badge">999+</span>
        </div>
      </div>

      <div class="chat">
        <img src="alhaji.jpg" alt="Alhaji Fx" class="avatar" />
        <div class="chat-info">
          <h2>CCohort 2025</h2>
          <p>📷 Photo</p>
        </div>
        <div class="meta">
          <span class="time">9:53 AM</span>
          <span class="badge">43</span>
        </div>
      </div>

      <div class="chat">
        <div class="avatar letter">S</div>
        <div class="chat-info">
          <h2>Sunday Forex</h2>
          <p>Na my street e dey</p>
        </div>
        <div class="meta">
          <span class="time">9:41 AM</span>
        </div>
      </div>

      <div class="chat">
        <img src="brojohn.jpg" alt="Bro John" class="avatar" />
        <div class="chat-info">
          <h2>School</h2>
          <p>📞 Voice call</p>
        </div>
        <div class="meta">
          <span class="time">Yesterday</span>
        </div>
      </div>

      <div class="chat">
        <img src="ajolims.jpg" alt="Ajolims" class="avatar" />
        <div class="chat-info">
          <h2>SQI</h2>
          <p>Thank you so much</p>
        </div>
        <div class="meta">
          <span class="time">Yesterday</span>
          <span class="badge">2</span>
        </div>
      </div>

      <div class="chat">
        <img src="ifefore.jpg" alt="Ibefore" class="avatar" />
        <div class="chat-info">
          <h2>Ibefore</h2>
          <p>Sticker</p>
        </div>
        <div class="meta">
          <span class="time">Yesterday</span>
        </div>
      </div>

      <div class="chat">
        <img src="dotun.jpg" alt="Dotun Dada" class="avatar" />
        <div class="chat-info">
          <h2>Dotun Dada</h2>
          <p>Hello</p>
        </div>
        <div class="meta">
          <span class="badge">+</span>
        </div>
      </div>
    </main>

    <footer class="nav-bar">
      <button class="active">💬 Chats</button>
      <button>📢 Updates</button>
      <button>👥 Communities</button>
      <button>📞 Calls</button>
    </footer>
  </div>
</body>
</html>
